[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors      = ["Reverier-Xu <reverier.xu@woooo.tech>"]
description  = "One-stop multimedia workstation platform: 3D modeling, rendering, audio/video processing, and image processing."
edition      = "2024"
homepage     = "https://craft.woooo.tech"
license      = "GPL-2.0-or-later"
publish      = true
readme       = "README.md"
repository   = "https://github.com/Reverier-Xu/craftoria"
rust-version = "1.98"
version      = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
woocraft = { version = "0.6", default-features = false, features = [
  "resources",
  "terminal",
] }
woocraft-terminal = "0.6"

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = 3
panic         = "abort"
strip         = true
